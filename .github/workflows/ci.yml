name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/mvp-foundation]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tijra
          POSTGRES_PASSWORD: tijra
          POSTGRES_DB: tijra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tijra -d tijra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tijra:tijra@127.0.0.1:5432/tijra_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guard production database deploy
        shell: bash
        run: |
          if grep -n -- '--accept-data-loss' package.json railway.json; then
            echo 'Destructive Prisma deploy flag is forbidden for production.'
            exit 1
          fi

      - name: Apply schema to disposable CI database
        run: npm run db:deploy

      - name: Start production server
        run: |
          npm start > /tmp/tijra-next.log 2>&1 &
          echo $! > /tmp/tijra-next.pid

      - name: Release smoke test
        run: npm run release:smoke

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/tijra-next.log || true
